version: "1"
overrides:
  - db_type: text
    engine: postgresql
    go_type: string
    go_struct_tag: 'backend:"postgresql"'
  - db_type: text
    engine: mysql
    go_type: "database/sql.NullString"
    go_struct_tag: 'backend:"mysql"'
  - db_type: text
    engine: sqlite
    go_type:
      type: byte
      slice: true
    go_struct_tag: 'backend:"sqlite"'
  - column: entries.code
    engine: postgresql
    go_type:
      import: encoding/json
      type: RawMessage
  - column: entries.code
    engine: mysql
    go_type:
      type: byte
      slice: true
  - column: entries.code
    engine: sqlite
    go_type: string
packages:
  - engine: postgresql
    schema: ../v2/schema.sql
    queries: ../v2/query.sql
    name: pg
    path: pg
  - engine: mysql
    schema: ../v2/schema.sql
    queries: ../v2/query.sql
    name: mysql
    path: mysql
  - engine: sqlite
    schema: ../v2/schema.sql
    queries: ../v2/query.sql
    name: sqlite
    path: sqlite
