version: 2
updates:
  # The examples module replaces github.com/sqlc-dev/sqlc with ../, so it has
  # to carry the same versions as the root module. Listing both directories
  # lets each group update them together in a single pull request.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/examples"
    schedule:
      interval: "daily"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

