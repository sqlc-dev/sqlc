name: python
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.readthedocs.yaml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.readthedocs.yaml'
jobs:
  build:
    if: false
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: install ./...
        run: go install ./...
      - uses: actions/checkout@v7
        with:
          repository: sqlc-dev/sqlc-gen-python
          path: python
      - run: make test
        working-directory: python
      - run: sqlc diff
        working-directory: python/examples
